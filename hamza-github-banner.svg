<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Hamza Shalan — Networks and Cybersecurity</title>
  <desc id="desc">Dark navy cyber security themed profile banner with glowing blue shield and a connected network pattern</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080E1F"/>
      <stop offset="50%" stop-color="#101B35"/>
      <stop offset="100%" stop-color="#07172B"/>
    </linearGradient>
    <linearGradient id="bright" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2F8DFF"/>
      <stop offset="55%" stop-color="#42D9F5"/>
      <stop offset="100%" stop-color="#83F0FC"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C3972"/>
      <stop offset="1" stop-color="#0C8EBB"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#27446F" stroke-width="0.8" fill="none" opacity="0.30"/>
    </pattern>
    <radialGradient id="spot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#159CDE" stop-opacity="0.23"/>
      <stop offset="100%" stop-color="#159CDE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <ellipse cx="216" cy="160" rx="340" ry="270" fill="url(#spot)"/>
  <ellipse cx="1015" cy="210" rx="350" ry="230" fill="url(#spot)" opacity=".65"/>
  <path d="M0 5H1200" stroke="url(#bright)" stroke-width="5"/>
  <path d="M0 316H1200" stroke="#2079B7" stroke-width="3" opacity=".55"/>
  <!-- network circuitry on the right -->
  <g fill="none" stroke="#3DBEE8" stroke-width="1.6" opacity=".45">
    <path d="M904 72L958 95L1009 58L1071 91L1161 58"/>
    <path d="M946 184L995 150L1070 187L1139 162L1196 196"/>
    <path d="M1029 267L1070 187L1150 258"/>
    <path d="M996 150L1009 58M1071 91L1070 187L1161 58M1139 162L1150 258"/>
  </g>
  <g fill="#57E8F9" opacity=".95">
    <circle cx="904" cy="72" r="4"/><circle cx="958" cy="95" r="5"/><circle cx="1009" cy="58" r="4"/>
    <circle cx="1071" cy="91" r="5"/><circle cx="1161" cy="58" r="4"/>
    <circle cx="946" cy="184" r="4"/><circle cx="995" cy="150" r="4"/><circle cx="1070" cy="187" r="6"/>
    <circle cx="1139" cy="162" r="4"/><circle cx="1196" cy="196" r="4"/>
    <circle cx="1029" cy="267" r="4"/><circle cx="1150" cy="258" r="5"/>
  </g>
  <!-- left emblem -->
  <circle cx="175" cy="159" r="113" fill="#102B4B" stroke="#2E84D9" stroke-width="2" opacity=".95"/>
  <circle cx="175" cy="159" r="95" fill="none" stroke="#3DBCE7" stroke-dasharray="5 12" stroke-width="2" opacity=".7"/>
  <path d="M175 86L239 112V163C239 206 209 230 175 245C141 230 111 206 111 163V112Z" fill="url(#shield)" stroke="#79E8FB" stroke-width="5" stroke-linejoin="round"/>
  <path d="M175 111L215 128V161C215 186 201 205 175 217C149 205 135 186 135 161V128Z" fill="#0A213F" opacity=".72"/>
  <path d="M144 169L166 189L206 143" fill="none" stroke="#79EAFC" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- primary label -->
  <rect x="336" y="64" width="204" height="28" rx="14" fill="#123955" stroke="#2366A1"/>
  <text x="438" y="83" fill="#77E6F7" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CYBERSECURITY PROFILE</text>
  <text x="331" y="153" fill="#F4F9FF" font-family="DejaVu Sans,Arial,sans-serif" font-weight="800" font-size="58" letter-spacing="1.2">HAMZA SHALAN</text>
  <rect x="335" y="174" width="558" height="4" rx="2" fill="url(#bright)"/>
  <text x="335" y="218" fill="#65D7F5" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="24" letter-spacing="2">NETWORKS &amp; CYBERSECURITY</text>
  <text x="336" y="263" fill="#B8CBE3" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" letter-spacing="2">STUDENT  •  JORDAN  •  LEARNING EVERY DAY</text>
  <rect x="335" y="280" width="125" height="2" fill="#278BCA" opacity=".65"/>
</svg>
